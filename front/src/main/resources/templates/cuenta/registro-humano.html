<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/layout :: pagina(titulo='Registro de persona donante', contenido=~{::main})}">
<body>
<main id="contenido" tabindex="-1">
    <div class="contenedor" style="max-width:900px">
        <nav class="migas" aria-label="Ubicación"><a href="/registro">Registro</a> › Persona donante</nav>
        <h1>Registro de persona donante</h1>
        <p class="suave">Los campos marcados con <span class="obligatorio"></span> son obligatorios.</p>
        <form th:action="@{/registro/donante-humano}" method="post">
            <th:block th:replace="~{fragmentos/campos :: personaHumana(${form})}"></th:block>
            <th:block th:replace="~{fragmentos/campos :: direccion(${form}, false)}"></th:block>
            <th:block th:replace="~{fragmentos/campos :: contacto(${form})}"></th:block>
            <th:block th:replace="~{fragmentos/campos :: clave}"></th:block>
            <th:block th:replace="~{fragmentos/campos :: terminos}"></th:block>
            <th:block th:replace="~{fragmentos/campos :: difusionLogros(${form})}"></th:block>
            <div class="acciones">
                <a class="boton fantasma" href="/registro">Cancelar</a>
                <button class="boton" type="submit"><span class="spinner" aria-hidden="true"></span>Crear mi cuenta</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
